name: Build APK

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Скачать архив из релиза
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo "$GITHUB_REPOSITORY" --pattern "PokerVisionAI.zip" --clobber
          unzip -q -o PokerVisionAI.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Тесты движка
        working-directory: PokerVisionAI
        run: gradle :engine:test --stacktrace

      - name: Сборка APK
        working-directory: PokerVisionAI
        run: gradle :app:assembleOfflineDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: PokerVisionAI-apk
          path: PokerVisionAI/app/build/outputs/apk/**/*.apk
