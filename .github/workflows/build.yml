name: Build APK

on:
  push:
    paths:
      - "PokerVisionAI.zip"
      - ".github/workflows/build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Проверка архива
        run: test -f PokerVisionAI.zip || { echo "Архив ещё не загружен"; exit 0; }

      - name: Распаковка проекта
        if: hashFiles('PokerVisionAI.zip') != ''
        run: unzip -q PokerVisionAI.zip

      - uses: actions/setup-java@v4
        if: hashFiles('PokerVisionAI.zip') != ''
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        if: hashFiles('PokerVisionAI.zip') != ''

      - uses: gradle/actions/setup-gradle@v4
        if: hashFiles('PokerVisionAI.zip') != ''
        with:
          gradle-version: "8.11.1"

      - name: Тесты движка
        if: hashFiles('PokerVisionAI.zip') != ''
        working-directory: PokerVisionAI
        run: gradle :engine:test --stacktrace

      - name: Сборка APK
        if: hashFiles('PokerVisionAI.zip') != ''
        working-directory: PokerVisionAI
        run: gradle :app:assembleOfflineDebug --stacktrace

      - uses: actions/upload-artifact@v4
        if: hashFiles('PokerVisionAI.zip') != ''
        with:
          name: PokerVisionAI-apk
          path: PokerVisionAI/app/build/outputs/apk/**/*.apk
